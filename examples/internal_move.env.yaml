# Environment for internal_move.workflow.yaml — a route with no transporter
# (SPEC §4.6, §5.4).
#
# `cycler` has two positions. The arm can reach the **door**; it cannot reach the
# **block**. The cycler moves the plate between them itself, which the transport
# table states by writing `transporter: null`:
#
#   - { transporter: null, from: cycler.door, to: cycler.block, duration: 5 }
#
# That move is a transport like any other. It takes 5 seconds, it holds the cycler
# over its whole interval (source and destination device are the same machine, held
# once, §4.5), and it is ordered after `dispense` finishes and before
# `thermal_cycle` starts. What it does *not* do is occupy a transporter — there is
# none to occupy, and the arm stays free for other work meanwhile.
#
# The `transporter` key is required even here. Writing null is how the environment
# says "nothing carries this"; a missing key is an error instead, so a route that
# merely forgot to name its arm cannot pass for one that needs no arm.
#
# Modelling this with a made-up transporter (`cycler_internal`) would schedule the
# same, since every internal move holds the cycler anyway — but it would put a
# machine in the plan that no lab has, and hand the runner an id to look up.

time:
  unit: second

devices:
  - id: cycler
    spots: [door, block]
  - id: reader
    spots: [stage]

transporters:
  - id: arm

transports:
  # The cycler's own move: no transporter performs it.
  - { transporter: null, from: cycler.door, to: cycler.block, duration: 5 }
  # An ordinary carried move: the arm takes the plate out to the reader.
  - { transporter: arm, from: cycler.block, to: reader.stage, duration: 20 }

processes:

  dispense:
    modes:
      - id: door
        devices: [cycler]
        duration: 30
        output_spots: { plate: cycler.door }

  thermal_cycle:
    modes:
      - id: block
        devices: [cycler]
        duration: 300
        input_spots:  { plate: cycler.block }
        output_spots: { out:   cycler.block }

  measure:
    modes:
      - devices: [reader]
        duration: 45
        input_spots: { plate: reader.stage }
