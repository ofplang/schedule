# Environment for consumable.workflow.yaml — one reader holding a limited stock.
#
# `reader` declares a consumable `reagent` with a capacity of 6 (SPEC §5.2): the
# most it can ever hold, not what it holds now. What it holds when the run begins
# is a property of the run, so it is in the execution document instead
# (consumable.document.yaml, SPEC §6.10).
#
# `assay` draws 2 units per run, written in the qualified form `<device>.<resource>`
# because a mode may name more than one device (SPEC §5.5). Two readers would each
# hold their own independent `reagent`.
#
# There is no way to refill here: replenishment is specified but not implemented, so
# the stock only falls. An environment may legitimately be written this way even
# once refills exist — it describes a stock an operator tops up outside the schedule.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: reader
    spots: [stage]
    resources:
      reagent: { capacity: 6 }
  - id: bin
    spots: [chute]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: bench.slot_a, to: reader.stage, duration: 2 }
  - { transporter: arm, from: bench.slot_b, to: reader.stage, duration: 2 }
  - { transporter: arm, from: reader.stage, to: bin.chute, duration: 2 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 3
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 3
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - devices: [reader]
        duration: 10
        input_spots:  { plate: reader.stage }
        output_spots: { out: reader.stage }
        consumption:  { reader.reagent: 2 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }

objective:
  kind: makespan
