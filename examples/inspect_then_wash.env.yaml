# Environment for inspect_then_wash.workflow.yaml.
#
# Cups wait in a three-slot `tray`. One `scope` inspects a cup at a time on its
# `stage`; one `sink` washes and one `buffer` polishes, each a cup at a time; finished
# cups go to a three-slot `rack`. One arm moves them.

time:
  unit: second

devices:
  - id: tray
    spots: [a, b, c]
  - id: scope
    spots: [stage]
  - id: sink
    spots: [basin]
  - id: buffer
    spots: [pad]
  - id: rack
    spots: [a, b, c]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: tray.a, to: scope.stage, duration: 2 }
  - { transporter: arm, from: tray.b, to: scope.stage, duration: 2 }
  - { transporter: arm, from: tray.c, to: scope.stage, duration: 2 }
  - { transporter: arm, from: scope.stage, to: sink.basin, duration: 2 }
  - { transporter: arm, from: scope.stage, to: buffer.pad, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.a, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.b, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.c, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.a, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.b, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.c, duration: 2 }

processes:

  inspect:
    modes:
      - devices: [scope]
        duration: 3
        input_spots:  { cup: scope.stage }
        output_spots: { cup: scope.stage }

  wash:
    modes:
      - devices: [sink]
        duration: 8
        input_spots:  { cup: sink.basin }
        output_spots: { cup: sink.basin }

  polish:
    modes:
      - devices: [buffer]
        duration: 4
        input_spots:  { cup: buffer.pad }
        output_spots: { cup: buffer.pad }
