# Environment for rinse_until_clean.workflow.yaml.
#
# The plate starts on `rack.in` and ends on `rack.out`. One `sink` rinses, one
# `reader` reads, one `oven` dries; one arm moves the plate between them.

time:
  unit: second

devices:
  - id: rack
    spots: [in, out]
  - id: sink
    spots: [basin]
  - id: reader
    spots: [slot]
  - id: oven
    spots: [shelf]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: rack.in, to: sink.basin, duration: 2 }
  - { transporter: arm, from: sink.basin, to: reader.slot, duration: 2 }
  - { transporter: arm, from: reader.slot, to: sink.basin, duration: 2 }
  - { transporter: arm, from: reader.slot, to: oven.shelf, duration: 2 }
  - { transporter: arm, from: oven.shelf, to: rack.out, duration: 2 }

processes:

  rinse:
    modes:
      - devices: [sink]
        duration: 4
        input_spots:  { plate: sink.basin }
        output_spots: { plate: sink.basin }

  read:
    modes:
      - devices: [reader]
        duration: 2
        input_spots:  { plate: reader.slot }
        output_spots: { plate: reader.slot }

  dry:
    modes:
      - devices: [oven]
        duration: 6
        input_spots:  { plate: oven.shelf }
        output_spots: { plate: oven.shelf }
