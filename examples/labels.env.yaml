# Environment for labels.workflow.yaml.
#
# A `labeller` makes a labelled cup on its output spot, one at a time; a `filler`
# fills one cup at a time. Filled cups go to a three-slot `rack`. One arm moves them.

time:
  unit: second

devices:
  - id: labeller
    spots: [out]
  - id: filler
    spots: [stage]
  - id: rack
    spots: [a, b, c]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: labeller.out, to: filler.stage, duration: 2 }
  - { transporter: arm, from: filler.stage, to: rack.a, duration: 2 }
  - { transporter: arm, from: filler.stage, to: rack.b, duration: 2 }
  - { transporter: arm, from: filler.stage, to: rack.c, duration: 2 }

processes:

  cup_create_from_label:
    modes:
      - devices: [labeller]
        duration: 4
        output_spots: { cup: labeller.out }

  fill:
    modes:
      - devices: [filler]
        duration: 6
        input_spots:  { cup: filler.stage }
        output_spots: { cup: filler.stage }
