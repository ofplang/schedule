# Environment for storage.workflow.yaml — the non-accessing mode (SPEC §4.4.2).
#
# `fridge` is a refrigerator at a fixed temperature with two slots. Putting a plate
# in it occupies a slot; it does not occupy the machine. That is what
# `device_access: false` on `chill` says: the mode binds its spot and takes its 180
# seconds, but no device is held, so the two chills run side by side and the arm can
# reach into the fridge while a plate is resting there.
#
# The device is still named. It owns the spot, it is what the plan reports, and a
# `fridge` taken out of service takes its `chill` modes with it — a machine that is
# down cannot be put anything into.
#
# Putting in and taking out are not modelled here and do not need to be: they are
# transport activities, and a transport occupies the source and destination devices
# over its own interval (§4.5).
#
# One slot per mode: `chill` offers two, and the scheduler picks. Three plates over
# two slots means the third waits for one to free up — the spot is exclusive even
# though the device is not.
#
# Delete `device_access` and the same instance says 650 instead of 450: the three
# chills would serialise on a machine that does nothing for 180 seconds at a time.

time:
  unit: second

devices:
  - id: prep
    spots: [bench_1, bench_2]
  - id: fridge
    spots: [slot_1, slot_2]
  - id: reader
    spots: [stage]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: prep.bench_1, to: fridge.slot_1, duration: 10 }
  - { transporter: arm, from: prep.bench_1, to: fridge.slot_2, duration: 10 }
  - { transporter: arm, from: prep.bench_2, to: fridge.slot_1, duration: 10 }
  - { transporter: arm, from: prep.bench_2, to: fridge.slot_2, duration: 10 }
  - { transporter: arm, from: fridge.slot_1, to: reader.stage, duration: 10 }
  - { transporter: arm, from: fridge.slot_2, to: reader.stage, duration: 10 }

processes:

  prep:
    modes:
      - id: bench_1
        devices: [prep]
        duration: 20
        output_spots: { plate: prep.bench_1 }
      - id: bench_2
        devices: [prep]
        duration: 20
        output_spots: { plate: prep.bench_2 }

  chill:                                  # holds a slot, not the machine (§4.4.2)
    modes:
      - id: slot_1
        devices: [fridge]
        device_access: false
        duration: 180
        input_spots:  { plate: fridge.slot_1 }
        output_spots: { out:   fridge.slot_1 }
      - id: slot_2
        devices: [fridge]
        device_access: false
        duration: 180
        input_spots:  { plate: fridge.slot_2 }
        output_spots: { out:   fridge.slot_2 }

  measure:
    modes:
      - devices: [reader]
        duration: 30
        input_spots: { plate: reader.stage }
