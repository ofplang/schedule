# Execution document for consumable.workflow.yaml: what the run starts with.
#
# `inventories.initial` is the level of each stock at the *start of the run*, not
# now (SPEC §6.10). Levels at any later moment are replayed from this plus the
# history, so this section does not change from one replan to the next — the same
# treatment `interface` gets, and for the same reason.
#
# Required here because some invoked mode declares `consumption` (SPEC §9.3).
# `initial: {}` would be the way to say every stock starts empty; leaving the
# section out entirely is `missing_inventories`.
#
# The reader starts empty, so the two assays (2 units each) cannot run until the
# dispenser has been. The scheduler works out that one refill covers both -- it
# fills to capacity, and 6 covers 4 -- and places it early enough to cost nothing.
inventories:
  initial:
    reader:
      reagent: 0

# How *this run* is to be optimised (SPEC §4.8, §5.8) — a property of the run, not
# of the lab, which is why it sits here beside `interface` and `inventories` rather
# than in the environment. Omitting it would give exactly this, the default; it is
# written out to show the shape. Without the second stage a refill that delays
# nothing is free, so the plan could carry refills that serve no purpose.
objective:
  kind: [makespan, replenishment_count]

activities: []
