# One loading bay, two racks — the environment for shared_bay.document.yaml.
#
# Deliberately narrow at the front and wide at the back. `loader` has a single
# `stage`, so two jobs that both start there have to take turns; `output` has two
# racks, so their results can sit side by side.
#
# That asymmetry is the example. Entry material holds its bay only from its job's
# release until the move that collects it, so one bay serves both runs as long as
# their releases leave room. A delivered result holds its rack until the run is over
# (SPEC §6.8), so two jobs delivering to one rack could never work however the
# schedule was arranged — which is why there are two.
#
# Otherwise this is `interface_load.env.yaml`: load, heat, deliver.

time:
  unit: second

devices:
  - id: loader
    spots: [stage]
  - id: heater
    spots: [stage]
  - id: output
    spots: [rack_a, rack_b]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: loader.stage, to: heater.stage, duration: 2 }
  - { transporter: arm, from: heater.stage, to: output.rack_a, duration: 2 }
  - { transporter: arm, from: heater.stage, to: output.rack_b, duration: 2 }

processes:

  heat:
    modes:
      - devices: [heater]
        duration: 10
        input_spots:  { plate: heater.stage }
        output_spots: { out: heater.stage }
