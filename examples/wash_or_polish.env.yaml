# Environment for wash_or_polish.workflow.yaml.
#
# Cups wait in a three-slot `tray`. One `sink` washes, one `buffer` polishes, each a
# cup at a time; finished cups go to a three-slot `rack`. One arm moves them.

time:
  unit: second

devices:
  - id: tray
    spots: [a, b, c]
  - id: sink
    spots: [basin]
  - id: buffer
    spots: [pad]
  - id: rack
    spots: [a, b, c]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: tray.a, to: sink.basin, duration: 2 }
  - { transporter: arm, from: tray.b, to: sink.basin, duration: 2 }
  - { transporter: arm, from: tray.c, to: sink.basin, duration: 2 }
  - { transporter: arm, from: tray.a, to: buffer.pad, duration: 2 }
  - { transporter: arm, from: tray.b, to: buffer.pad, duration: 2 }
  - { transporter: arm, from: tray.c, to: buffer.pad, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.a, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.b, duration: 2 }
  - { transporter: arm, from: sink.basin, to: rack.c, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.a, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.b, duration: 2 }
  - { transporter: arm, from: buffer.pad, to: rack.c, duration: 2 }

processes:

  wash:
    modes:
      - devices: [sink]
        duration: 8
        input_spots:  { cup: sink.basin }
        output_spots: { cup: sink.basin }

  polish:
    modes:
      - devices: [buffer]
        duration: 4
        input_spots:  { cup: buffer.pad }
        output_spots: { cup: buffer.pad }
