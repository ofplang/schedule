time: {unit: second}
devices:
- id: fridge_0
  spots: [slot_1, slot_2]
processes:
  chill:
    modes:
    - id: slot_1
      devices: [fridge_0]
      device_access: false
      duration: 180
      input_spots: {plate: fridge_0.slot_1}
      output_spots: {plate: fridge_0.slot_1}
    - id: slot_2
      devices: [fridge_0]
      device_access: false
      duration: 180
      input_spots: {plate: fridge_0.slot_2}
      output_spots: {plate: fridge_0.slot_2}
