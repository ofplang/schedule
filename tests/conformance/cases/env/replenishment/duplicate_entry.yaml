time: {unit: second}
devices:
- id: reader_0
  spots: [stage]
  resources:
    dye: {capacity: 6}
processes:
  measure_od:
    modes:
    - devices: [reader_0]
      duration: 45
      input_spots: {plate: reader_0.stage}
      output_spots: {plate: reader_0.stage}
      consumption: {reader_0.dye: 2}
replenishers:
- {id: dispenser_0}
replenishments:
- {replenisher: dispenser_0, device: reader_0, duration: 30}
- {replenisher: dispenser_0, device: reader_0, duration: 40}
