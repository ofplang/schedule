# `processes` is written twice. YAML resolves it last-wins, so this document
# declares only `assay` even though it appears to declare `measure_od` too.
time: {unit: second}
devices:
- id: reader_0
  spots: [stage]
processes:
  measure_od:
    modes:
    - devices: [reader_0]
      duration: 45
      input_spots: {plate: reader_0.stage}
processes:
  assay:
    modes:
    - devices: [reader_0]
      duration: 10
      input_spots: {plate: reader_0.stage}
