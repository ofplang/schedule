[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofplang-schedule"
version = "0.0.0"
description = "Object-flow programming language v0 scheduler"
requires-python = ">=3.10"
# `ofplang-validate` is a local sibling repo (not published); install it editable
# alongside this one: `pip install -e ../ofplang-validate`. It is imported only by
# the CLI front door (cli.py) to validate a workflow once before scheduling; the
# scheduler library never calls it, so library users take no validation overhead.
dependencies = ["PyYAML>=6.0", "ortools>=9.10", "ofplang-validate"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
# Standalone command; the umbrella `ofp` CLI (separate repo) exposes this as
# `ofp schedule`.
ofp-schedule = "ofplang.schedule.cli:main"

# `ofplang` is a PEP 420 namespace shared across the org's repos (validate,
# schedule, run, …); this distribution provides only the `ofplang.schedule`
# package under it.
[tool.setuptools.packages.find]
include = ["ofplang*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]
# YMap (core/yamlnode.py) exposes a read-only mapping API via .keys()/.get() but
# does not implement __iter__, so SIM118's `for x in d.keys()` -> `for x in d`
# rewrite is invalid for it. Disable the rule rather than special-case each call.
ignore = ["SIM118"]

[tool.mypy]
python_version = "3.10"
files = ["ofplang"]
# `ofplang` is a PEP 420 namespace package (no __init__.py), so tell mypy how to
# root it rather than letting it guess module names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# ortools has no type info and pulls in numpy, whose stubs use 3.12-only syntax
# that fails to parse under python_version 3.10. Don't follow into either.
[[tool.mypy.overrides]]
module = ["numpy.*", "ortools.*"]
follow_imports = "skip"
