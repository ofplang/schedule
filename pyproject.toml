[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ofplang-schedule"
description = "Scheduler for Object-flow Programming Language workflows."
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazunari Kaizu", email = "kwaizu@gmail.com" }]
keywords = ["ofplang", "dataflow", "workflow", "scheduler", "cp-sat", "ortools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# `ofplang-validate` is imported only by the CLI front door (cli.py) to validate a
# workflow once before scheduling; the scheduler library never calls it, so
# library users take no validation overhead. The `>=0.1.2` floor ensures that
# front door recognizes optional `description` metadata (spec 2.7).
dependencies = ["PyYAML>=6.0", "ortools>=9.10", "ofplang-validate>=0.1.2"]

[project.urls]
Homepage = "https://github.com/ofplang/schedule"
Repository = "https://github.com/ofplang/schedule"

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
# Standalone command; the umbrella `ofp` CLI (separate repo) exposes this as
# `ofp schedule`.
ofp-schedule = "ofplang.schedule.cli:main"

# Version is derived from git tags (e.g. `v0.1.0`) by setuptools-scm; there is no
# static version in this file.
[tool.setuptools_scm]

# `ofplang` is a PEP 420 namespace shared across the org's repos (validate,
# schedule, run, …); this distribution provides only the `ofplang.schedule`
# package under it.
[tool.setuptools.packages.find]
include = ["ofplang*"]
namespaces = true

# Ship the PEP 561 marker so downstreams see this package as typed.
[tool.setuptools.package-data]
"ofplang.schedule" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]
# YMap (core/yamlnode.py) exposes a read-only mapping API via .keys()/.get() but
# does not implement __iter__, so SIM118's `for x in d.keys()` -> `for x in d`
# rewrite is invalid for it. Disable the rule rather than special-case each call.
ignore = ["SIM118"]

[tool.mypy]
python_version = "3.10"
files = ["ofplang"]
# `ofplang` is a PEP 420 namespace package (no __init__.py), so tell mypy how to
# root it rather than letting it guess module names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# ortools has no type info and pulls in numpy, whose stubs use 3.12-only syntax
# that fails to parse under python_version 3.10. Don't follow into either.
[[tool.mypy.overrides]]
module = ["numpy.*", "ortools.*"]
follow_imports = "skip"
