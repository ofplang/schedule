name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `ofplang-validate` (a sibling, used by the CLI front door) is resolved from
      # PyPI by the `.[test]` install below — no separate git step needed.
      - run: pip install -e ".[test]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ruff is a static analyzer: it needs neither the project installed nor the
      # (PyPI-absent) ofplang-validate dependency resolved, so install ruff alone.
      - run: pip install "ruff>=0.16"
      # The whole tree, so `examples/` is linted too (ruff's own defaults skip
      # build/venv dirs and honour .gitignore).
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # mypy resolves `ofplang.validate` (imported by the CLI); the `.[dev]` install
      # pulls it from PyPI.
      - run: pip install -e ".[dev]"
      - run: mypy
